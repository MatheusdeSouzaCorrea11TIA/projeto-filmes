<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Editar Filme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/editar.css">
</head>

<body>
    <div class="frame">
        <header class="marquee">
            <div class="kicker">Painel administrativo</div>
            <h1>Editar filme</h1>
        </header>

        <div class="layout">
            <section>
                <div class="list-head">
                    <h2>Selecione um filme</h2>
                    <span class="count" id="movie-count"></span>
                </div>
                <div id="movie-list"></div>
            </section>

            <section class="panel">
                <h2>Dados do filme</h2>
                <p class="sub" id="form-sub">Escolha um filme na lista para editar</p>

                <form id="edit-form">
                    <div class="field">
                        <label for="titulo">Título</label>
                        <input id="titulo" type="text" placeholder="Selecione um filme" disabled>
                    </div>
                    <div class="field">
                        <label for="genero">Gênero</label>
                        <input id="genero" type="text" placeholder="—" disabled>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="duracao">Duração (min)</label>
                            <input id="duracao" type="number" min="1" placeholder="—" disabled>
                        </div>
                        <div class="field">
                            <label for="faixa-etaria">Faixa etária</label>
                            <input id="faixa-etaria" type="text" placeholder="—" disabled>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn-primary" id="submit-btn" disabled>Salvar alterações</button>
                        <button type="button" class="btn-ghost" id="cancel-btn" style="display:none;">Cancelar</button>
                    </div>
                    <div id="form-status"></div>
                </form>
            </section>
        </div>
    </div>

    <script src="./js/editar.js"></script>
</body>

</html>
